name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    name: Тестирование и сборка Docker-образа

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Проверка линтером (ruff — опционально, но красиво)
        run: |
          pip install ruff
          ruff check app/

      - name: Запуск простого теста (проверка импортов и запуска)
        run: |
          python -c "from app.main import app; print('FastAPI app импортирован успешно')"

      - name: Сборка Docker-образа (проверка, что Dockerfile валидный)
        run: |
          docker build -t simple-todo .
          echo "Docker-образ успешно собран"
